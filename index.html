<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Browser</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #0b0f14;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    min-height: 100vh;
    padding: 70px 18px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 35px;
}

.subtitle {
    color: #8b95a5;
    margin-bottom: 30px;
}

.search-box {
    width: 100%;
    max-width: 700px;
    display: flex;
    gap: 10px;
}

.search-box input {
    flex: 1;
    height: 58px;
    border: 1px solid #303844;
    border-radius: 30px;
    background: #151b23;
    color: white;
    padding: 0 22px;
    font-size: 18px;
    outline: none;
}

.search-box input:focus {
    border-color: #4d8dff;
}

.search-box button {
    width: 110px;
    border: none;
    border-radius: 30px;
    background: #4d8dff;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.search-box button:active {
    transform: scale(.97);
}

.engines {
    margin-top: 18px;
    color: #8b95a5;
    font-size: 14px;
}

.results {
    width: 100%;
    max-width: 700px;
    margin-top: 35px;
}

.result {
    background: #151b23;
    border: 1px solid #252d38;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
}

.result a {
    color: #6da5ff;
    font-size: 19px;
    text-decoration: none;
}

.result p {
    color: #aab3c0;
    margin: 8px 0 0;
    line-height: 1.4;
}

.error {
    color: #ff7777;
    text-align: center;
    margin-top: 20px;
}

@media (max-width: 600px) {
    .container {
        padding-top: 90px;
    }

    .logo {
        font-size: 36px;
    }

    .search-box input {
        height: 54px;
        font-size: 16px;
    }

    .search-box button {
        width: 90px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">My Browser</div>

    <div class="subtitle">
        Поиск в интернете
    </div>

    <form class="search-box" id="searchForm">
        <input
            id="searchInput"
            type="text"
            placeholder="Что хотите найти?"
            autocomplete="off"
        >

        <button type="submit">
            Найти
        </button>
    </form>

    <div class="engines">
        Поиск через DuckDuckGo
    </div>

    <div class="results" id="results"></div>

</div>

<script>

const form = document.getElementById("searchForm");
const input = document.getElementById("searchInput");
const results = document.getElementById("results");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const query = input.value.trim();

    if (!query) {
        input.focus();
        return;
    }

    /*
      Открываем настоящий поиск DuckDuckGo.
      Пользователь сможет искать любые сайты,
      новости, изображения и другую информацию.
    */

    const url =
        "https://duckduckgo.com/?q=" +
        encodeURIComponent(query);

    window.location.href = url;
});

</script>

</body>
</html>
