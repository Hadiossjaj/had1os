<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050816">

<title>Had1oS</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(91,63,255,.28),
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 35%,
            rgba(0,220,255,.22),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #050816,
            #080b18 45%,
            #02060d
        );

    overflow-x: hidden;
}

/* =========================
   BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -2;
}

.grid {
    position: absolute;
    inset: 0;

    opacity: .17;

    background-image:
        linear-gradient(
            rgba(255,255,255,.07) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.07) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}

.orb {
    position: absolute;

    width: 430px;
    height: 430px;

    border-radius: 50%;

    filter: blur(80px);

    opacity: .35;

    animation:
        float 9s ease-in-out infinite;
}

.orb.one {
    background: #643cff;
    top: 8%;
    left: -180px;
}

.orb.two {
    background: #00d9ff;
    right: -180px;
    top: 42%;

    animation-delay: -4s;
}

@keyframes float {

    0%,100% {
        transform: translate(0,0);
    }

    50% {
        transform: translate(30px,-40px);
    }
}

/* =========================
   HEADER
========================= */

header {

    width: 100%;

    padding:
        28px
        6%;

    display: flex;

    justify-content: space-between;
    align-items: center;

    border-bottom:
        1px solid rgba(255,255,255,.08);

    background:
        rgba(5,8,22,.55);

    backdrop-filter: blur(20px);

    position: relative;

    z-index: 20;
}

.logo {

    display: flex;
    align-items: center;

    gap: 12px;

    font-size: 36px;
    font-weight: 800;
}

.logo-dot {

    width: 15px;
    height: 15px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #7665ff,
            #24d9ff
        );

    box-shadow:
        0 0 20px #586aff;
}

/* =========================
   HEADER BUTTONS
========================= */

.header-actions {

    display: flex;
    gap: 14px;
}

.header-btn {

    border: 1px solid
        rgba(255,255,255,.15);

    background:
        rgba(255,255,255,.06);

    color: white;

    padding: 16px 25px;

    border-radius: 22px;

    font-size: 18px;
    font-weight: 600;

    cursor: pointer;

    transition:
        .25s ease;

    backdrop-filter: blur(15px);
}

.header-btn:hover {

    transform: translateY(-3px);

    background:
        rgba(255,255,255,.12);

    border-color:
        rgba(130,150,255,.5);

    box-shadow:
        0 10px 30px
        rgba(60,80,255,.2);
}

.header-btn:active {
    transform: scale(.94);
}

/* =========================
   HERO
========================= */

.hero {

    min-height: calc(100vh - 100px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 60px 20px;

    position: relative;
}

.hero h1 {

    font-size:
        clamp(
            60px,
            12vw,
            140px
        );

    font-weight: 900;

    letter-spacing: -8px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #9bb0ff,
            #64eaff
        );

    -webkit-background-clip: text;

    color: transparent;

    text-shadow:
        0 0 45px
        rgba(100,130,255,.15);
}

.hero p {

    margin-top: 20px;

    max-width: 650px;

    color: #9da7c2;

    font-size: 20px;

    line-height: 1.6;
}

/* =========================
   SPHERE
========================= */

.sphere {

    margin-top: 55px;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 30% 28%,
            rgba(255,255,255,.2),
            transparent 13%
        ),

        radial-gradient(
            circle at 65% 65%,
            rgba(0,220,255,.25),
            transparent 30%
        ),

        radial-gradient(
            circle at 45% 45%,
            #352078,
            #090d1d 70%
        );

    box-shadow:

        inset 0 0 60px
        rgba(0,0,0,.7),

        0 0 70px
        rgba(75,100,255,.18);

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;

    animation:
        sphereFloat 5s ease-in-out infinite;
}

.sphere::after {

    content: "";

    position: absolute;

    width: 500px;
    height: 110px;

    border:
        1px solid
        rgba(0,220,255,.3);

    border-radius: 50%;

    transform:
        rotate(-8deg);
}

.sphere span {

    font-size: 100px;

    font-weight: 900;

    text-shadow:
        0 0 35px
        rgba(255,255,255,.3);
}

@keyframes sphereFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }
}

/* =========================
   MENU
========================= */

.menu-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(8px);

    z-index: 100;

    opacity: 0;

    visibility: hidden;

    transition:
        .25s ease;
}

.menu-overlay.active {

    opacity: 1;

    visibility: visible;
}

.menu-panel {

    position: absolute;

    top: 100px;
    right: 5%;

    width: min(
        430px,
        90%
    );

    padding: 22px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius: 30px;

    background:
        rgba(5,8,22,.92);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.5);

    transform:
        translateY(-20px)
        scale(.96);

    transition:
        .3s ease;
}

.menu-overlay.active
.menu-panel {

    transform:
        translateY(0)
        scale(1);
}

.menu-title {

    font-size: 14px;

    color: #77809d;

    letter-spacing: 3px;

    margin:
        5px 8px 18px;
}

.menu-item {

    width: 100%;

    border: none;

    background: transparent;

    color: #dce2f5;

    padding: 18px 15px;

    display: flex;

    align-items: center;

    gap: 17px;

    font-size: 21px;

    text-align: left;

    border-radius: 18px;

    cursor: pointer;

    transition:
        .2s ease;
}

.menu-item:hover {

    background:
        rgba(255,255,255,.07);

    transform:
        translateX(5px);
}

.menu-item:active {

    transform:
        scale(.96);

    background:
        rgba(90,110,255,.18);
}

.menu-icon {

    width: 38px;

    font-size: 26px;

    text-align: center;
}

/* =========================
   CHOICE MODAL
========================= */

.choice-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(12px);

    z-index: 200;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    opacity: 0;

    visibility: hidden;

    transition: .25s ease;
}

.choice-overlay.active {

    opacity: 1;

    visibility: visible;
}

.choice-box {

    width: min(
        430px,
        100%
    );

    background:
        linear-gradient(
            145deg,
            rgba(16,22,50,.98),
            rgba(5,8,22,.98)
        );

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 28px;

    padding: 25px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.6);

    transform:
        scale(.85)
        translateY(20px);

    transition:
        .3s cubic-bezier(
            .2,.8,.2,1
        );
}

.choice-overlay.active
.choice-box {

    transform:
        scale(1)
        translateY(0);
}

.choice-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    margin-bottom: 20px;
}

.choice-header h2 {

    font-size: 25px;
}

.close-btn {

    width: 40px;
    height: 40px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.12);

    background:
        rgba(255,255,255,.06);

    color: white;

    font-size: 23px;

    cursor: pointer;

    transition: .2s;
}

.close-btn:hover {

    background:
        rgba(255,255,255,.15);

    transform: rotate(90deg);
}

.choice-description {

    color: #8791ad;

    margin-bottom: 20px;

    line-height: 1.5;
}

.choice-option {

    width: 100%;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.045);

    color: white;

    padding: 17px;

    margin-top: 10px;

    border-radius: 18px;

    display: flex;

    align-items: center;

    gap: 15px;

    cursor: pointer;

    font-size: 18px;

    transition:
        .2s ease;
}

.choice-option:hover {

    background:
        rgba(90,110,255,.16);

    border-color:
        rgba(110,140,255,.45);

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(60,80,255,.12);
}

.choice-option:active {

    transform:
        scale(.95);
}

.option-icon {

    font-size: 25px;
}

/* =========================
   TOAST
========================= */

.toast {

    position: fixed;

    left: 50%;

    bottom: 30px;

    transform:
        translate(-50%,30px);

    background:
        rgba(15,20,40,.95);

    border:
        1px solid
        rgba(255,255,255,.15);

    padding:
        14px 22px;

    border-radius: 15px;

    color: #dce2f5;

    opacity: 0;

    pointer-events: none;

    transition: .3s ease;

    z-index: 500;

    backdrop-filter:
        blur(15px);
}

.toast.show {

    opacity: 1;

    transform:
        translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    header {

        padding:
            22px 18px;
    }

    .logo {

        font-size: 28px;
    }

    .header-btn {

        padding:
            13px 18px;

        font-size: 16px;

        border-radius: 18px;
    }

    .hero {

        padding-top: 40px;
    }

    .hero h1 {

        letter-spacing: -5px;
    }

    .hero p {

        font-size: 17px;
    }

    .sphere {

        width: 250px;
        height: 250px;
    }

    .sphere span {

        font-size: 80px;
    }

    .sphere::after {

        width: 360px;
    }

    .menu-panel {

        top: 90px;

        right: 5%;

        padding: 17px;
    }

    .menu-item {

        font-size: 19px;

        padding: 16px 12px;
    }
}

</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="background">

    <div class="grid"></div>

    <div class="orb one"></div>

    <div class="orb two"></div>

</div>


<!-- HEADER -->

<header>

    <div class="logo">

        <div class="logo-dot"></div>

        Had1oS

    </div>


    <div class="header-actions">

        <button
            class="header-btn"
            onclick="openLogin()">

            Войти

        </button>

        <button
            class="header-btn"
            onclick="toggleMenu()">

            ☰

        </button>

    </div>

</header>


<!-- MAIN -->

<main class="hero">

    <h1>Had1oS</h1>

    <p>
        Быстрый доступ к поиску,
        музыке, видео, картам,
        новостям и другим сервисам.
    </p>

    <div class="sphere">

        <span>H</span>

    </div>

</main>


<!-- MENU -->

<div
    class="menu-overlay"
    id="menuOverlay"
    onclick="closeMenu(event)">

    <div
        class="menu-panel"
        onclick="event.stopPropagation()">

        <div class="menu-title">
            СЕРВИСЫ HAD1OS
        </div>


        <button
            class="menu-item"
            onclick="openChoice('search')">

            <span class="menu-icon">🔎</span>

            <span>Поиск</span>

        </button>


        <button
            class="menu-item"
            onclick="openChoice('images')">

            <span class="menu-icon">🖼️</span>

            <span>Картинки</span>

        </button>


        <button
            class="menu-item"
            onclick="openChoice('video')">

            <span class="menu-icon">🎬</span>

            <span>Видео</span>

        </button>


        <button
            class="menu-item"
            onclick="openChoice('news')">

            <span class="menu-icon">📰</span>

            <span>Новости</span>

        </button>


        <button
            class="menu-item"
            onclick="openChoice('maps')">

            <span class="menu-icon">🗺️</span>

            <span>Карты</span>

        </button>


        <button
            class="menu-item"
            onclick="openChoice('music')">

            <span class="menu-icon">🎵</span>

            <span>Музыка</span>

        </button>


        <button
            class="menu-item"
            onclick="openChoice('games')">

            <span class="menu-icon">🎮</span>

            <span>Игры</span>

        </button>


        <button
            class="menu-item"
            onclick="openChoice('cloud')">

            <span class="menu-icon">☁️</span>

            <span>Облако</span>

        </button>

    </div>

</div>


<!-- CHOICE MODAL -->

<div
    class="choice-overlay"
    id="choiceOverlay"
    onclick="closeChoice(event)">

    <div
        class="choice-box"
        onclick="event.stopPropagation()">

        <div class="choice-header">

            <h2 id="choiceTitle">
                Выберите сервис
            </h2>

            <button
                class="close-btn"
                onclick="closeChoice()">

                ×

            </button>

        </div>


        <div
            class="choice-description"
            id="choiceDescription">

            Выберите, куда перейти.

        </div>


        <div id="choiceOptions"></div>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast">

    Готово

</div>


<script>

/* =========================
   MENU
========================= */

function toggleMenu() {

    const menu =
        document.getElementById(
            "menuOverlay"
        );

    menu.classList.toggle("active");
}


function closeMenu(event) {

    if (
        !event ||
        event.target.id ===
        "menuOverlay"
    ) {

        document
            .getElementById(
                "menuOverlay"
            )
            .classList.remove(
                "active"
            );
    }
}


/* =========================
   SERVICES
========================= */

const services = {

    search: {

        title: "Поиск",

        description:
            "Выберите поисковую систему.",

        options: [

            {
                name: "Safari",
                icon: "🧭",
                url:
                    "https://www.google.com/"
            },

            {
                name: "Google",
                icon: "🔵",
                url:
                    "https://www.google.com/"
            },

            {
                name: "Яндекс",
                icon: "🔴",
                url:
                    "https://yandex.ru/"
            }

        ]

    },


    images: {

        title: "Картинки",

        description:
            "Выберите сервис изображений.",

        options: [

            {
                name: "Google Картинки",
                icon: "🔵",
                url:
                    "https://images.google.com/"
            },

            {
                name: "Яндекс.Картинки",
                icon: "🔴",
                url:
                    "https://yandex.ru/images/"
            }

        ]

    },


    video: {

        title: "Видео",

        description:
            "Выберите видеосервис.",

        options: [

            {
                name: "YouTube",
                icon: "▶️",
                url:
                    "https://www.youtube.com/"
            },

            {
                name: "VK Видео",
                icon: "🔵",
                url:
                    "https://vkvideo.ru/"
            },

            {
                name: "Rutube",
                icon: "▶️",
                url:
                    "https://rutube.ru/"
            }

        ]

    },


    news: {

        title: "Новости",

        description:
            "Выберите новостной сервис.",

        options: [

            {
                name: "Google News",
                icon: "📰",
                url:
                    "https://news.google.com/"
            },

            {
                name: "Яндекс Новости",
                icon: "🔴",
                url:
                    "https://dzen.ru/news"
            }

        ]

    },


    maps: {

        title: "Карты",

        description:
            "Выберите картографический сервис.",

        options: [

            {
                name: "Google Maps",
                icon: "🌎",
                url:
                    "https://maps.google.com/"
            },

            {
                name: "Яндекс Карты",
                icon: "🟡",
                url:
                    "https://yandex.ru/maps/"
            },

            {
                name: "Apple Maps",
                icon: "🍎",
                url:
                    "https://maps.apple.com/"
            }

        ]

    },


    music: {

        title: "Музыка",

        description:
            "Выберите музыкальный сервис.",

        options: [

            {
                name: "VK Музыка",
                icon: "🎵",
                url:
                    "https://vk.com/music"
            },

            {
                name: "Spotify",
                icon: "🟢",
                url:
                    "https://open.spotify.com/"
            }

        ]

    },


    games: {

        title: "Игры",

        description:
            "Выберите игровой сервис.",

        options: [

            {
                name: "VK Play",
                icon: "🎮",
                url:
                    "https://vkplay.ru/"
            },

            {
                name: "Steam",
                icon: "🎮",
                url:
                    "https://store.steampowered.com/"
            }

        ]

    },


    cloud: {

        title: "Облако",

        description:
            "Выберите облачное хранилище.",

        options: [

            {
                name: "Google Drive",
                icon: "☁️",
                url:
                    "https://drive.google.com/"
            },

            {
                name: "Яндекс Диск",
                icon: "☁️",
                url:
                    "https://disk.yandex.ru/"
            }

        ]

    }

};


/* =========================
   OPEN CHOICE
========================= */

function openChoice(type) {

    const service =
        services[type];

    if (!service) return;


    document
        .getElementById(
            "menuOverlay"
        )
        .classList.remove(
            "active"
        );


    document
        .getElementById(
            "choiceTitle"
        )
        .textContent =
        service.title;


    document
        .getElementById(
            "choiceDescription"
        )
        .textContent =
        service.description;


    const options =
        document.getElementById(
            "choiceOptions"
        );

    options.innerHTML = "";


    service.options.forEach(
        option => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "choice-option";


            button.innerHTML = `

                <span class="option-icon">
                    ${option.icon}
                </span>

                <span>
                    ${option.name}
                </span>

            `;


            button.onclick = () => {

                showToast(
                    "Открываем " +
                    option.name
                );

                setTimeout(() => {

                    window.location.href =
                        option.url;

                }, 250);

            };


            options.appendChild(
                button
            );

        }
    );


    document
        .getElementById(
            "choiceOverlay"
        )
        .classList.add(
            "active"
        );
}


/* =========================
   CLOSE CHOICE
========================= */

function closeChoice(event) {

    if (
        !event ||
        event.target.id ===
        "choiceOverlay"
    ) {

        document
            .getElementById(
                "choiceOverlay"
            )
            .classList.remove(
                "active"
            );
    }
}


/* =========================
   LOGIN
========================= */

function openLogin() {

    document
        .getElementById(
            "choiceTitle"
        )
        .textContent =
        "Аккаунт Had1oS";


    document
        .getElementById(
            "choiceDescription"
        )
        .textContent =
        "Авторизация будет подключена через Supabase.";


    const options =
        document.getElementById(
            "choiceOptions"
        );


    options.innerHTML = `

        <button
            class="choice-option"
            onclick="loginComingSoon()">

            <span class="option-icon">
                👤
            </span>

            <span>
                Войти в аккаунт
            </span>

        </button>


        <button
            class="choice-option"
            onclick="loginComingSoon()">

            <span class="option-icon">
                ✨
            </span>

            <span>
                Создать аккаунт
            </span>

        </button>

    `;


    document
        .getElementById(
            "choiceOverlay"
        )
        .classList.add(
            "active"
        );
}


function loginComingSoon() {

    showToast(
        "Авторизацию подключим следующим шагом"
    );

}


/* =========================
   TOAST
========================= */

let toastTimer;


function showToast(text) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        }, 1800);
}


/* =========================
   ESC
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            document
                .getElementById(
                    "menuOverlay"
                )
                .classList.remove(
                    "active"
                );

            document
                .getElementById(
                    "choiceOverlay"

                    "active"
                );
        }

    }
);

</script>
