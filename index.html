<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Had1oS</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background: #fff;
    color: #202124;
    overflow-x: hidden;
}

/* ================= HEADER ================= */

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 28px;
    gap: 22px;
}

.header-link {
    color: #202124;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
}

.header-link:hover {
    text-decoration: underline;
}

.apps-button {
    width: 42px;
    height: 42px;
    border: none;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    font-size: 22px;
    transition: .2s;
}

.apps-button:hover {
    background: #f1f3f4;
}

.login-button {
    border: none;
    background: #1a73e8;
    color: white;
    border-radius: 24px;
    padding: 11px 21px;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
}

.login-button:hover {
    background: #1765cc;
    box-shadow: 0 2px 8px rgba(26,115,232,.25);
}

/* ================= MAIN ================= */

main {
    min-height: calc(100vh - 70px - 92px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 105px;
}

/* LOGO */

.logo {
    font-size: clamp(62px, 13vw, 92px);
    font-weight: 700;
    letter-spacing: -5px;
    margin-bottom: 38px;

    background: linear-gradient(
        90deg,
        #4285f4,
        #7c4dff,
        #00a884,
        #4285f4
    );

    background-size: 300% auto;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: logoGradient 7s linear infinite,
               logoFloat 4s ease-in-out infinite;
}

@keyframes logoGradient {
    0% { background-position: 0% center; }
    100% { background-position: 300% center; }
}

@keyframes logoFloat {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-5px);
    }
}

/* ================= SEARCH ================= */

.search-wrapper {
    width: min(680px, calc(100% - 32px));
    position: relative;
}

.search-box {
    width: 100%;
    min-height: 54px;

    border: 1px solid #dfe1e5;
    border-radius: 28px;

    display: flex;
    align-items: center;

    padding: 0 15px 0 19px;

    background: white;

    transition:
        box-shadow .25s,
        border-color .25s,
        transform .25s;
}

.search-box:hover,
.search-box.active {
    border-color: transparent;
    box-shadow:
        0 1px 6px rgba(32,33,36,.15),
        0 4px 18px rgba(32,33,36,.08);
}

.search-icon {
    font-size: 20px;
    color: #70757a;
    margin-right: 12px;
}

#searchInput {
    flex: 1;
    border: none;
    outline: none;
    font-size: 17px;
    color: #202124;
    background: transparent;
    min-width: 0;
}

#searchInput::placeholder {
    color: #9aa0a6;
}

.voice-button,
.clear-button {
    width: 38px;
    height: 38px;
    border: none;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    font-size: 19px;
    transition: .2s;
}

.voice-button:hover,
.clear-button:hover {
    background: #f1f3f4;
}

/* ================= SUGGESTIONS ================= */

.suggestions {
    position: absolute;
    top: 60px;
    left: 0;
    right: 0;

    background: white;

    border-radius: 0 0 24px 24px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.12);

    overflow: hidden;

    display: none;

    z-index: 50;
}

.suggestions.show {
    display: block;
}

.suggestion {
    display: flex;
    align-items: center;
    gap: 13px;

    padding: 12px 20px;

    cursor: pointer;

    font-size: 15px;
}

.suggestion:hover {
    background: #f8f9fa;
}

.suggestion-icon {
    color: #70757a;
}

/* ================= BUTTONS ================= */

.search-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 30px;
    flex-wrap: wrap;
}

.action-button {
    border: 1px solid #f8f9fa;
    background: #f8f9fa;

    color: #3c4043;

    padding: 11px 19px;

    border-radius: 5px;

    font-size: 14px;

    cursor: pointer;

    transition:
        background .2s,
        box-shadow .2s,
        transform .15s;
}

.action-button:hover {
    background: white;
    border-color: #dadce0;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
}

.action-button:active {
    transform: scale(.96);
}

/* ================= SEARCH ENGINE ================= */

.engine-panel {
    margin-top: 26px;

    display: flex;
    align-items: center;
    gap: 10px;

    color: #5f6368;

    font-size: 13px;
}

.engine-select {
    border: 1px solid #dadce0;
    border-radius: 18px;

    padding: 7px 13px;

    background: white;

    color: #3c4043;

    outline: none;

    cursor: pointer;
}

/* ================= QUICK LINKS ================= */

.quick-links {
    display: flex;
    justify-content: center;
    gap: 12px;

    margin-top: 50px;

    flex-wrap: wrap;

    width: min(700px, calc(100% - 30px));
}

.quick-card {
    width: 105px;
    height: 85px;

    border-radius: 14px;

    background: #fff;

    border: 1px solid #eceff1;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 7px;

    cursor: pointer;

    transition:
        transform .25s,
        box-shadow .25s,
        border-color .25s;
}

.quick-card:hover {
    transform: translateY(-5px);
    border-color: #dadce0;

    box-shadow:
        0 6px 18px rgba(60,64,67,.12);
}

.quick-icon {
    font-size: 25px;
}

.quick-name {
    font-size: 12px;
    color: #5f6368;
}

/* ================= FOOTER ================= */

footer {
    min-height: 92px;

    background: #f2f2f2;

    border-top: 1px solid #dadce0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 20px 35px;

    color: #70757a;

    font-size: 14px;
}

.footer-left,
.footer-right {
    display: flex;
    gap: 25px;
}

.footer-link {
    cursor: pointer;
}

.footer-link:hover {
    text-decoration: underline;
}

/* ================= TOAST ================= */

.toast {
    position: fixed;

    bottom: 30px;
    left: 50%;

    transform:
        translate(-50%, 30px);

    background: #202124;
    color: white;

    padding: 12px 20px;

    border-radius: 25px;

    font-size: 14px;

    opacity: 0;
    pointer-events: none;

    transition: .3s;

    z-index: 100;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* ================= MENU ================= */

.menu {
    position: fixed;

    top: 68px;
    right: 22px;

    width: 270px;

    background: white;

    border: 1px solid #dadce0;

    border-radius: 18px;

    padding: 12px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.15);

    opacity: 0;
    visibility: hidden;

    transform:
        translateY(-10px)
        scale(.97);

    transition: .2s;

    z-index: 100;
}

.menu.show {
    opacity: 1;
    visibility: visible;

    transform:
        translateY(0)
        scale(1);
}

.menu-title {
    font-weight: 600;
    padding: 10px 12px 8px;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 12px;

    border-radius: 12px;

    cursor: pointer;

    transition: .2s;
}

.menu-item:hover {
    background: #f1f3f4;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 600px) {

    header {
        height: 62px;
        padding: 0 15px;
        gap: 10px;
    }

    .header-link {
        display: none;
    }

    .login-button {
        padding: 10px 16px;
    }

    main {
        padding-top: 75px;
    }

    .logo {
        margin-bottom: 28px;
    }

    .search-box {
        min-height: 52px;
    }

    .search-buttons {
        margin-top: 22px;
    }

    .quick-links {
        margin-top: 35px;
    }

    .quick-card {
        width: 92px;
        height: 78px;
    }

    footer {
        flex-direction: column;
        gap: 18px;
        text-align: center;
    }

    .footer-left,
    .footer-right {
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>

    <a class="header-link"
       href="https://mail.google.com"
       target="_blank">
        Почта
    </a>

    <a class="header-link"
       href="https://images.google.com"
       target="_blank">
        Картинки
    </a>

    <button class="apps-button"
            onclick="toggleMenu()"
            aria-label="Меню">
        ⋮⋮⋮
    </button>

    <button class="login-button"
            onclick="showLoginMessage()">
        Войти
    </button>

</header>


<!-- ================= MENU ================= -->

<div class="menu" id="menu">

    <div class="menu-title">
        Had1oS
    </div>

    <div class="menu-item"
         onclick="searchType('web')">
        🔎
        <span>Поиск</span>
    </div>

    <div class="menu-item"
         onclick="searchType('images')">
        🖼️
        <span>Картинки</span>
    </div>

    <div class="menu-item"
         onclick="searchType('video')">
        🎬
        <span>Видео</span>
    </div>

    <div class="menu-item"
         onclick="searchType('news')">
        📰
        <span>Новости</span>
    </div>

    <div class="menu-item"
         onclick="searchType('maps')">
        🗺️
        <span>Карты</span>
    </div>

    <div class="menu-item"
         onclick="openMusic()">
        🎵
        <span>Музыка</span>
    </div>

</div>


<!-- ================= MAIN ================= -->

<main>

    <div class="logo">
        Had1oS
    </div>


    <!-- SEARCH -->

    <div class="search-wrapper">

        <div class="search-box"
             id="searchBox">

            <span class="search-icon">
                🔍
            </span>

            <input
                id="searchInput"
                type="text"
                autocomplete="off"
                placeholder="Поиск"
                aria-label="Поиск"
            >

            <button
                class="clear-button"
                id="clearButton"
                onclick="clearSearch()"
                style="display:none;">
                ×
            </button>

            <button
                class="voice-button"
                onclick="voiceSearch()"
                aria-label="Голосовой поиск">
                🎙️
            </button>

        </div>


        <!-- SUGGESTIONS -->

        <div class="suggestions"
             id="suggestions">

            <div class="suggestion">
                <span class="suggestion-icon">↗</span>
                <span>Популярный поиск</span>
            </div>

        </div>

    </div>


    <!-- BUTTONS -->

    <div class="search-buttons">

        <button
            class="action-button"
            onclick="performSearch()">
            Поиск Had1oS
        </button>

        <button
            class="action-button"
            onclick="luckySearch()">
            Мне повезёт
        </button>

    </div>


    <!-- ENGINE -->

    <div class="engine-panel">

        <span>Искать через:</span>

        <select
            class="engine-select"
            id="engineSelect">

            <option value="google">
                Google
            </option>

            <option value="yandex">
                Яндекс
            </option>

            <option value="bing">
                Bing
            </option>

            <option value="duck">
                DuckDuckGo
            </option>

        </select>

    </div>


    <!-- QUICK LINKS -->

    <div class="quick-links">

        <div class="quick-card"
             onclick="openURL('https://www.youtube.com')">

            <div class="quick-icon">
                ▶️
            </div>

            <div class="quick-name">
                YouTube
            </div>

        </div>


        <div class="quick-card"
             onclick="openURL('https://vk.com')">

            <div class="quick-icon">
                VK
            </div>

            <div class="quick-name">
                VK
            </div>

        </div>


        <div class="quick-card"
             onclick="openURL('https://open.spotify.com')">

            <div class="quick-icon">
                🎵
            </div>

            <div class="quick-name">
                Spotify
            </div>

        </div>


        <div class="quick-card"
             onclick="openURL('https://github.com')">

            <div class="quick-icon">
                🐙
            </div>

            <div class="quick-name">
                GitHub
            </div>

        </div>


        <div class="quick-card"
             onclick="openURL('https://www.google.com/maps')">

            <div class="quick-icon">
                🗺️
            </div>

            <div class="quick-name">
                Карты
            </div>

        </div>

    </div>

</main>


<!-- ================= FOOTER ================= -->

<footer>

    <div class="footer-left">

        <span class="footer-link">
            О Had1oS
        </span>

        <span class="footer-link">
            Реклама
        </span>

        <span class="footer-link">
            Для бизнеса
        </span>

    </div>


    <div class="footer-right">

        <span class="footer-link">
            Конфиденциальность
        </span>

        <span class="footer-link">
            Условия
        </span>

        <span class="footer-link"
              onclick="showAbout()">
            Настройки
        </span>

    </div>

</footer>


<!-- ================= TOAST ================= -->

<div class="toast"
     id="toast">
</div>


<script>

/* =========================================
   ELEMENTS
========================================= */

const input =
    document.getElementById("searchInput");

const searchBox =
    document.getElementById("searchBox");

const clearButton =
    document.getElementById("clearButton");

const suggestions =
    document.getElementById("suggestions");

const menu =
    document.getElementById("menu");

const toast =
    document.getElementById("toast");


/* =========================================
   SEARCH ENGINE URLS
========================================= */

function getSearchURL(query) {

    const engine =
        document.getElementById("engineSelect").value;

    const encoded =
        encodeURIComponent(query);

    if (engine === "google") {
        return "https://www.google.com/search?q=" + encoded;
    }

    if (engine === "yandex") {
        return "https://yandex.ru/search/?text=" + encoded;
    }

    if (engine === "bing") {
        return "https://www.bing.com/search?q=" + encoded;
    }

    if (engine === "duck") {
        return "https://duckduckgo.com/?q=" + encoded;
    }

    return "https://www.google.com/search?q=" + encoded;
}


/* =========================================
   NORMAL SEARCH
========================================= */

function performSearch() {

    const query =
        input.value.trim();

    if (!query) {

        showToast("Введите запрос");

        input.focus();

        return;
    }

    window.location.href =
        getSearchURL(query);
}


/* =========================================
   ENTER
========================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            performSearch();

        }

        if (event.key === "Escape") {

            clearSearch();

        }

    }
);


/* =========================================
   INPUT ANIMATION
========================================= */

input.addEventListener(
    "focus",
    function() {

        searchBox.classList.add("active");

    }
);

input.addEventListener(
    "blur",
    function() {

        setTimeout(() => {

            searchBox.classList.remove("active");

        }, 150);

    }
);


/* =========================================
   CLEAR BUTTON
========================================= */

input.addEventListener(
    "input",
    function() {

        clearButton.style.display =
            input.value.length
            ? "block"
            : "none";

        if (input.value.length > 0) {

            suggestions.classList.add("show");

        } else {

            suggestions.classList.remove("show");

        }

    }
);


function clearSearch() {

    input.value = "";

    clearButton.style.display = "none";

    suggestions.classList.remove("show");

    input.focus();

}


/* =========================================
   LUCKY SEARCH
========================================= */

function luckySearch() {

    const query =
        input.value.trim();

    if (!query) {

        showToast("Сначала введите запрос");

        input.focus();

        return;
    }

    const url =
        getSearchURL(query)
        + "&btnI=1";

    window.location.href = url;

}


/* =========================================
   VOICE SEARCH
========================================= */

function voiceSearch() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        showToast(
            "Голосовой поиск не поддерживается этим браузером"
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "ru-RU";

    recognition.interimResults = false;

    recognition.maxAlternatives = 1;


    showToast("Слушаю…");


    recognition.start();


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0].transcript;

            input.value = text;

            clearButton.style.display = "block";

            performSearch();

        };


    recognition.onerror =
        function() {

            showToast(
                "Не удалось распознать голос"
            );

        };

}


/* =========================================
   MENU
========================================= */

function toggleMenu() {

    menu.classList.toggle("show");

}


document.addEventListener(
    "click",
    function(event) {

        if (
            !menu.contains(event.target) &&
            !event.target.closest(".apps-button")
        ) {

            menu.classList.remove("show");

        }

    }
);


/* =========================================
   MENU SEARCH TYPES
========================================= */

function searchType(type) {

    const query =
        input.value.trim();

    if (!query) {

        showToast("Введите запрос");

        menu.classList.remove("show");

        input.focus();

        return;
    }

    const encoded =
        encodeURIComponent(query);

    let url;


    if (type === "web") {

        url =
            "https://www.google.com/search?q="
            + encoded;

    }


    if (type === "images") {

        url =
            "https://www.google.com/search?tbm=isch&q="
            + encoded;

    }


    if (type === "video") {

        url =
            "https://www.youtube.com/results?search_query="
            + encoded;

    }


    if (type === "news") {

        url =
            "https://news.google.com/search?q="
            + encoded;

    }


    if (type === "maps") {

        url =
            "https://www.google.com/maps/search/"
            + encoded;

    }


    window.location.href = url;

}


/* =========================================
   MUSIC
========================================= */

function openMusic() {

    menu.classList.remove("show");

    const choice =
        confirm(
            "Открыть Spotify?\n\nНажмите «Отмена», чтобы открыть VK."
        );

    if (choice) {

        window.open(
            "https://open.spotify.com",
            "_blank"
        );

    } else {

        window.open(
            "https://vk.com/music",
            "_blank"
        );

    }

}


/* =========================================
   QUICK LINKS
========================================= */

function openURL(url) {

    window.open(
        url,
        "_blank"
    );

}


/* =========================================
   LOGIN
========================================= */

function showLoginMessage() {

    showToast(
        "Авторизация Had1oS скоро будет доступна"
    );

}


/* =========================================
   ABOUT
========================================= */

function showAbout() {

    showToast(
        "Had1oS — твой персональный поисковый экран"
    );

}


/* =========================================
   TOAST
========================================= */

let toastTimer;

function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove("show");

            },
            2800
        );

}


/* =========================================
   RANDOM STARTUP ANIMATION
========================================= */

window.addEventListener(
    "load",
    function() {

        setTimeout(
            () => {

                document.querySelector(".logo")
                    .style.opacity = "1";

            },
            100
        );

    }
);


/* =========================================
   SUGGESTION CLICK
========================================= */

document.querySelectorAll(".suggestion")
    .forEach(
        item => {

            item.addEventListener(
                "click",
                function() {

                    input.value =
                        "популярные запросы";

                    performSearch();

                }

            );

        }
    );

</script>

</body>
</html>
