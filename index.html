<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>Had1oS Search</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #fff;
    color: #202124;

    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

header {
    height: 72px;

    display: flex;
    align-items: center;

    padding: 0 28px;

    border-bottom: 1px solid #f1f3f4;

    position: sticky;
    top: 0;

    background: rgba(255,255,255,.94);

    backdrop-filter: blur(15px);

    z-index: 100;
}

.small-logo {
    font-size: 29px;
    font-weight: 800;

    letter-spacing: -1.5px;

    cursor: pointer;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #7657ff,
            #00a884,
            #4285f4
        );

    background-size: 300%;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        gradientMove 7s linear infinite;
}

@keyframes gradientMove {
    from {
        background-position: 0%;
    }

    to {
        background-position: 300%;
    }
}

/* =========================
   HEADER SEARCH
========================= */

.header-search {
    width: min(650px, 60vw);

    margin-left: 45px;

    height: 46px;

    border: 1px solid #dfe1e5;

    border-radius: 24px;

    display: flex;
    align-items: center;

    padding: 0 8px 0 16px;

    transition: .25s;

    background: white;
}

.header-search:hover,
.header-search:focus-within {
    box-shadow:
        0 1px 6px rgba(32,33,36,.15);

    border-color: transparent;
}

.header-search input {
    flex: 1;

    border: none;
    outline: none;

    font-size: 16px;

    color: #202124;

    min-width: 0;
}

.header-search button {
    width: 36px;
    height: 36px;

    border: none;

    background: transparent;

    border-radius: 50%;

    cursor: pointer;

    font-size: 17px;
}

.header-search button:hover {
    background: #f1f3f4;
}

/* =========================
   RIGHT HEADER
========================= */

.header-right {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 15px;
}

.menu-button {
    width: 40px;
    height: 40px;

    border: none;

    background: transparent;

    border-radius: 50%;

    cursor: pointer;

    font-size: 21px;
}

.menu-button:hover {
    background: #f1f3f4;
}

.login-button {
    border: none;

    background: #1a73e8;

    color: white;

    padding: 10px 19px;

    border-radius: 22px;

    cursor: pointer;

    font-size: 14px;

    transition: .2s;
}

.login-button:hover {
    background: #1765cc;

    box-shadow:
        0 3px 10px rgba(26,115,232,.25);
}

/* =========================
   SEARCH NAV
========================= */

.search-nav {
    max-width: 900px;

    margin: 0 auto;

    padding: 0 20px;

    display: flex;

    gap: 28px;

    height: 52px;

    align-items: end;

    border-bottom: 1px solid #f1f3f4;
}

.nav-item {
    height: 52px;

    display: flex;

    align-items: center;

    gap: 7px;

    color: #5f6368;

    font-size: 14px;

    cursor: pointer;

    position: relative;

    white-space: nowrap;
}

.nav-item:hover {
    color: #202124;
}

.nav-item.active {
    color: #1a73e8;
}

.nav-item.active::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;
    bottom: -1px;

    height: 3px;

    border-radius: 3px 3px 0 0;

    background: #1a73e8;
}

/* =========================
   MAIN
========================= */

main {
    max-width: 900px;

    margin: 0 auto;

    padding:
        25px 20px 80px;
}

/* =========================
   RESULT INFO
========================= */

.result-info {
    color: #70757a;

    font-size: 13px;

    margin-bottom: 28px;
}

/* =========================
   RESULTS
========================= */

.results {
    display: flex;

    flex-direction: column;

    gap: 27px;
}

.result {
    max-width: 720px;

    animation:
        resultAppear .45s ease both;
}

@keyframes resultAppear {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.result-url {
    color: #188038;

    font-size: 14px;

    margin-bottom: 5px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.result-title {
    color: #1a0dab;

    font-size: 21px;

    font-weight: 500;

    cursor: pointer;

    margin-bottom: 5px;
}

.result-title:hover {
    text-decoration: underline;
}

.result-description {
    color: #4d5156;

    font-size: 15px;

    line-height: 1.55;
}

/* =========================
   WELCOME
========================= */

.welcome {
    min-height: 55vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;
}

.welcome-logo {
    font-size: clamp(65px, 13vw, 105px);

    font-weight: 800;

    letter-spacing: -6px;

    margin-bottom: 20px;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #7657ff,
            #00a884,
            #4285f4
        );

    background-size: 300%;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        gradientMove 7s linear infinite,
        welcomeFloat 4s ease-in-out infinite;
}

@keyframes welcomeFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }
}

.welcome-text {
    color: #70757a;

    font-size: 17px;

    max-width: 520px;

    line-height: 1.6;
}

/* =========================
   QUICK CARDS
========================= */

.quick {
    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;

    margin-top: 38px;
}

.quick-card {
    width: 110px;
    height: 85px;

    border: 1px solid #eceff1;

    border-radius: 14px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 7px;

    cursor: pointer;

    transition: .25s;

    background: white;
}

.quick-card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 7px 22px rgba(60,64,67,.12);
}

.quick-icon {
    font-size: 25px;
}

.quick-name {
    color: #5f6368;

    font-size: 12px;
}

/* =========================
   MENU
========================= */

.menu {
    position: fixed;

    top: 67px;
    right: 20px;

    width: 260px;

    background: white;

    border: 1px solid #dadce0;

    border-radius: 18px;

    padding: 10px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.16);

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(-10px)
        scale(.96);

    transition: .2s;

    z-index: 500;
}

.menu.show {
    opacity: 1;

    visibility: visible;

    transform:
        translateY(0)
        scale(1);
}

.menu-title {
    font-weight: 700;

    padding:
        12px 13px;
}

.menu-item {
    padding: 13px;

    display: flex;

    align-items: center;

    gap: 12px;

    border-radius: 12px;

    cursor: pointer;

    transition: .2s;
}

.menu-item:hover {
    background: #f1f3f4;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 30px;

    transform:
        translate(-50%, 30px);

    opacity: 0;

    pointer-events: none;

    background: #202124;

    color: white;

    padding: 12px 20px;

    border-radius: 25px;

    font-size: 14px;

    z-index: 1000;

    transition: .3s;
}

.toast.show {
    opacity: 1;

    transform:
        translate(-50%, 0);
}

/* =========================
   FOOTER
========================= */

footer {
    background: #f2f2f2;

    border-top: 1px solid #dadce0;

    min-height: 75px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        18px 35px;

    color: #70757a;

    font-size: 13px;
}

.footer-group {
    display: flex;

    gap: 24px;
}

.footer-item {
    cursor: pointer;
}

.footer-item:hover {
    text-decoration: underline;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    header {
        height: 62px;

        padding:
            0 12px;
    }

    .small-logo {
        font-size: 23px;
    }

    .header-search {
        margin-left: 12px;

        width: auto;

        flex: 1;

        height: 42px;
    }

    .header-right {
        gap: 4px;
    }

    .login-button {
        display: none;
    }

    .search-nav {
        gap: 18px;

        overflow-x: auto;

        scrollbar-width: none;
    }

    .search-nav::-webkit-scrollbar {
        display: none;
    }

    .nav-item {
        font-size: 13px;
    }

    main {
        padding:
            20px 16px 60px;
    }

    .result-title {
        font-size: 19px;
    }

    .result-description {
        font-size: 14px;
    }

    .welcome {
        min-height: 58vh;
    }

    .welcome-logo {
        letter-spacing: -5px;
    }

    .quick-card {
        width: 94px;
        height: 78px;
    }

    footer {
        flex-direction: column;

        gap: 18px;

        text-align: center;
    }

    .footer-group {
        flex-wrap: wrap;

        justify-content: center;

        gap: 14px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div
        class="small-logo"
        onclick="goHome()">
        Had1oS
    </div>


    <div class="header-search">

        <input
            id="headerInput"
            type="text"
            placeholder="Поиск"
            autocomplete="off"
        >

        <button
            onclick="clearHeader()">
            ×
        </button>

        <button
            onclick="voiceSearch()">
            🎙️
        </button>

        <button
            onclick="performSearch()">
            🔍
        </button>

    </div>


    <div class="header-right">

        <button
            class="menu-button"
            onclick="toggleMenu()">
            ⋮⋮⋮
        </button>

        <button
            class="login-button"
            onclick="login()">
            Войти
        </button>

    </div>

</header>


<!-- =========================
     MENU
========================= -->

<div
    class="menu"
    id="menu">

    <div class="menu-title">
        Had1oS
    </div>

    <div
        class="menu-item"
        onclick="goHome()">
        🏠
        Главная
    </div>

    <div
        class="menu-item"
        onclick="searchType('images')">
        🖼️
        Картинки
    </div>

    <div
        class="menu-item"
        onclick="searchType('video')">
        🎬
        Видео
    </div>

    <div
        class="menu-item"
        onclick="searchType('news')">
        📰
        Новости
    </div>

    <div
        class="menu-item"
        onclick="searchType('maps')">
        🗺️
        Карты
    </div>

    <div
        class="menu-item"
        onclick="music()">
        🎵
        Музыка
    </div>

</div>


<!-- =========================
     NAV
========================= -->

<nav
    class="search-nav"
    id="searchNav">

    <div
        class="nav-item active"
        onclick="searchType('web')">
        🔎
        Все
    </div>

    <div
        class="nav-item"
        onclick="searchType('images')">
        🖼️
        Картинки
    </div>

    <div
        class="nav-item"
        onclick="searchType('video')">
        🎬
        Видео
    </div>

    <div
        class="nav-item"
        onclick="searchType('news')">
        📰
        Новости
    </div>

    <div
        class="nav-item"
        onclick="searchType('maps')">
        🗺️
        Карты
    </div>

</nav>


<!-- =========================
     MAIN
========================= -->

<main id="main">

    <section class="welcome">

        <div class="welcome-logo">
            Had1oS
        </div>

        <div class="welcome-text">
            Быстрый поиск в интернете.
            Выбирай сервис и находи нужную информацию.
        </div>


        <div class="quick">

            <div
                class="quick-card"
                onclick="openURL('https://www.youtube.com')">

                <div class="quick-icon">
                    ▶️
                </div>

                <div class="quick-name">
                    YouTube
                </div>

            </div>


            <div
                class="quick-card"
                onclick="openURL('https://vk.com')">

                <div class="quick-icon">
                    VK
                </div>

                <div class="quick-name">
                    VK
                </div>

            </div>


            <div
                class="quick-card"
                onclick="openURL('https://open.spotify.com')">

                <div class="quick-icon">
                    🎵
                </div>

                <div class="quick-name">
                    Spotify
                </div>

            </div>


            <div
                class="quick-card"
                onclick="openURL('https://github.com')">

                <div class="quick-icon">
                    🐙
                </div>

                <div class="quick-name">
                    GitHub
                </div>

            </div>


            <div
                class="quick-card"
                onclick="openURL('https://maps.google.com')">

                <div class="quick-icon">
                    🗺️
                </div>

                <div class="quick-name">
                    Карты
                </div>

            </div>

        </div>

    </section>


    <!-- RESULTS -->

    <section
        id="resultsSection"
        style="display:none;">

        <div
            class="result-info"
            id="resultInfo">
        </div>

        <div
            class="results"
            id="results">
        </div>

    </section>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <div class="footer-group">

        <span class="footer-item"
              onclick="about()">
            О Had1oS
        </span>

        <span class="footer-item">
            Конфиденциальность
        </span>

        <span class="footer-item">
            Условия
        </span>

    </div>


    <div class="footer-group">

        <span class="footer-item"
              onclick="settings()">
            Настройки
        </span>

    </div>

</footer>


<!-- TOAST -->

<div
    class="toast"
    id="toast">
</div>


<script>

/* =========================================
   VARIABLES
========================================= */

const input =
    document.getElementById(
        "headerInput"
    );

const welcome =
    document.querySelector(
        ".welcome"
    );

const resultsSection =
    document.getElementById(
        "resultsSection"
    );

const results =
    document.getElementById(
        "results"
    );

const resultInfo =
    document.getElementById(
        "resultInfo"
    );

const menu =
    document.getElementById(
        "menu"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================
   ENGINE
========================================= */

let selectedEngine =
    localStorage.getItem(
        "hadios-engine"
    ) || "google";


/* =========================================
   SEARCH URL
========================================= */

function getSearchURL(query) {

    const q =
        encodeURIComponent(query);


    if (selectedEngine === "yandex") {

        return (
            "https://yandex.ru/search/?text="
            + q
        );

    }


    if (selectedEngine === "bing") {

        return (
            "https://www.bing.com/search?q="
            + q
        );

    }


    if (selectedEngine === "duck") {

        return (
            "https://duckduckgo.com/?q="
            + q
        );

    }


    return (
        "https://www.google.com/search?q="
        + q
    );
}


/* =========================================
   SEARCH
========================================= */

function performSearch() {

    const query =
        input.value.trim();


    if (!query) {

        showToast(
            "Введите запрос"
        );

        input.focus();

        return;
    }


    saveSearch(query);


    /*
       Здесь Had1oS запоминает запрос,
       а затем отправляет его выбранному
       поисковику.
    */

    window.location.href =
        getSearchURL(query);
}


/* =========================================
   ENTER
========================================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            performSearch();

        }

    }
);


/* =========================================
   CLEAR
========================================= */

function clearHeader() {

    input.value = "";

    input.focus();

}


/* =========================================
   HISTORY
========================================= */

function saveSearch(query) {

    let history =
        JSON.parse(
            localStorage.getItem(
                "hadios-history"
            ) || "[]"
        );


    history =
        history.filter(
            item =>
                item.toLowerCase()
                !== query.toLowerCase()
        );


    history.unshift(query);


    history =
        history.slice(0, 20);


    localStorage.setItem(
        "hadios-history",
        JSON.stringify(history)
    );
}


/* =========================================
   SEARCH TYPES
========================================= */

function searchType(type) {

    const query =
        input.value.trim();


    if (!query) {

        showToast(
            "Введите запрос"
        );

        input.focus();

        return;
    }


    const q =
        encodeURIComponent(query);


    let url;


    if (type === "images") {

        url =
            "https://www.google.com/search?tbm=isch&q="
            + q;

    }


    else if (type === "video") {

        url =
            "https://www.youtube.com/results?search_query="
            + q;

    }


    else if (type === "news") {

        url =
            "https://news.google.com/search?q="
            + q;

    }


    else if (type === "maps") {

        url =
            "https://www.google.com/maps/search/"
            + q;

    }


    else {

        url =
            getSearchURL(query);

    }


    saveSearch(query);


    window.location.href =
        url;
}


/* =========================================
   VOICE
========================================= */

function voiceSearch() {

    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!Recognition) {

        showToast(
            "Голосовой поиск недоступен"
        );

        return;
    }


    const recognition =
        new Recognition();


    recognition.lang =
        "ru-RU";


    recognition.interimResults =
        false;


    showToast(
        "Слушаю…"
    );


    recognition.start();


    recognition.onresult =
        function(event) {

            input.value =
                event
                .results[0][0]
                .transcript;


            performSearch();

        };


    recognition.onerror =
        function() {

            showToast(
                "Не удалось распознать голос"
            );

        };

}


/* =========================================
   HOME
========================================= */

function goHome() {

    input.value = "";

    welcome.style.display =
        "flex";

    resultsSection.style.display =
        "none";

    window.scrollTo(
        0,
        0
    );

}


/* =========================================
   MENU
========================================= */

function toggleMenu() {

    menu.classList.toggle(
        "show"
    );

}


document.addEventListener(
    "click",
    function(event) {

        if (
            !menu.contains(
                event.target
            ) &&
            !event.target.closest(
                ".menu-button"
            )
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);


/* =========================================
   MUSIC
========================================= */

function music() {

    menu.classList.remove(
        "show"
    );


    const spotify =
        confirm(
            "Открыть Spotify?\n\n" +
            "Нажмите «Отмена», чтобы открыть VK Музыку."
        );


    if (spotify) {

        openURL(
            "https://open.spotify.com"
        );

    } else {

        openURL(
            "https://vk.com/music"
        );

    }

}


/* =========================================
   OPEN URL
========================================= */

function openURL(url) {

    window.open(
        url,
        "_blank"
    );

}


/* =========================================
   LOGIN
========================================= */

function login() {

    showToast(
        "Авторизация Had1oS скоро появится"
    );

}


/* =========================================
   ABOUT
========================================= */

function about() {

    showToast(
        "Had1oS — персональный поисковый портал"
    );

}


function settings() {

    const engine =
        prompt(
            "Выберите поисковик:\n\n" +
            "google — Google\n" +
            "yandex — Яндекс\n" +
            "bing — Bing\n" +
            "duck — DuckDuckGo",
            selectedEngine
        );


    if (
        engine === "google" ||
        engine === "yandex" ||
        engine === "bing" ||
        engine === "duck"
    ) {

        selectedEngine =
            engine;


        localStorage.setItem(
            "hadios-engine",
            engine
        );


        showToast(
            "Поисковик изменён"
        );

    }

}


/* =========================================
   TOAST
========================================= */

let toastTimer;


function showToast(message) {

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================
   ESC
========================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            menu.classList.remove(
                "show"
            );

        }

    }
);

</script>

</body>
</html>
