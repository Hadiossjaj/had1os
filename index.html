<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Browser</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f14;
    color: white;
    min-height: 100vh;
}

.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 70px 20px 30px;
}

.logo {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 35px;
}

.search-box {
    width: 100%;
    max-width: 700px;
    display: flex;
    background: #1a2029;
    border: 1px solid #303845;
    border-radius: 30px;
    padding: 6px;
}

.search-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 18px;
    padding: 14px 18px;
}

.search-box button {
    border: none;
    background: #3b82f6;
    color: white;
    border-radius: 25px;
    padding: 0 25px;
    font-size: 16px;
    cursor: pointer;
}

.search-box button:active {
    transform: scale(0.97);
}

.links {
    margin-top: 45px;
    width: 100%;
    max-width: 700px;
}

.links h2 {
    font-size: 20px;
    margin-bottom: 15px;
}

.link {
    display: block;
    text-decoration: none;
    color: white;
    background: #151b23;
    border: 1px solid #29313d;
    padding: 16px;
    margin-bottom: 10px;
    border-radius: 14px;
}

.link:hover {
    background: #202733;
}

.footer {
    margin-top: auto;
    padding-top: 50px;
    color: #697586;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        My Browser
    </div>

    <form class="search-box" id="searchForm">
        <input
            id="search"
            type="text"
            placeholder="Искать что угодно..."
            autocomplete="off"
        >

        <button type="submit">
            Поиск
        </button>
    </form>

    <div class="links">

        <h2>Быстрый доступ</h2>

        <a class="link"
           href="https://www.google.com"
           target="_blank">
            🔎 Google
        </a>

        <a class="link"
           href="https://www.youtube.com"
           target="_blank">
            ▶️ YouTube
        </a>

        <a class="link"
           href="https://ru.wikipedia.org"
           target="_blank">
            📚 Wikipedia
        </a>

        <a class="link"
           href="https://github.com"
           target="_blank">
            💻 GitHub
        </a>

    </div>

    <div class="footer">
        My Browser • Поиск в интернете
    </div>

</div>

<script>

document
    .getElementById("searchForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const query =
            document.getElementById("search").value.trim();

        if (!query) {
            return;
        }

        const url =
            "https://www.google.com/search?q=" +
            encodeURIComponent(query);

        window.location.href = url;
    });

</script>

</body>
</html>
